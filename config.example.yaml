# ============================================================================
#  语音控制电脑 Agent —— 配置文件
#  复制为 config.yaml 后按需修改；所有字段都有默认值，可以只写想改的部分。
# ============================================================================

# ── 语音推理算力 ───────────────────────────────────────────────────────────
speech:
  # 占用档位：fast(低占用) / balanced(默认) / quality(高质量，合成更好听但慢 3~4 倍)
  # 它决定了默认的线程数和合成引擎；下面单独写了 threads / tts.engine 就以写的为准
  profile: balanced
  # auto = 有可用显卡就用；cpu = 强制 CPU；cuda = 强制显卡
  # 注意：sherpa-onnx 官方 pip 包是 CPU 版构建，装 GPU 版才能真正用上显卡，
  # doctor 会如实告诉你最终跑在哪里
  device: auto
  threads: 0                # 0 = 按档位自动；低占用可写 2，追求速度可写 8
  # 这一节的三项都是「造模型时读一次」，改完要重启引擎才生效。
  # 在界面里改的话，主界面会弹一条提示，点「立即重启」就行，不用关程序。

# ── 声纹（说话人识别）─────────────────────────────────────────────────────
# 开启后，只有录过声纹的那个人的声音能唤醒；别人喊唤醒词不会被理会。
# 默认关闭：这是一件"配错了会把自己锁在门外"的功能，必须由你显式打开。
speaker:
  enabled: false
  threshold: 0.55          # 余弦相似度阈值：越大越严格。0.45 宽松 / 0.55 标准 / 0.65 严格
  model: ""                # 留空 = 自动使用 models/speaker/*.onnx
  profile: ""              # 留空 = build/voiceprint.json（声纹存在这里）
  # 声纹模型（约 38 MB）用 scripts/download_models.py --with-speaker 下载

# ── 音频 ───────────────────────────────────────────────────────────────────
audio:
  # null = 系统默认设备；数字 = 设备序号；字符串 = 设备名子串（不区分大小写）
  # 用  python -m voice_agent devices  查看本机设备列表
  input_device: null
  output_device: null
  sample_rate: 16000        # 语音模型统一 16k，不建议改
  block_ms: 32              # 音频块大小
  input_gain: 1.0
  # 输出音量。界面上那个音量条拖的就是它：0.0~2.0（1.0 = 原始音量，>1 会放大，
  # 超过 1.5 容易削顶，不建议）。改完**立刻生效**，不用重启引擎。
  output_gain: 1.0

# ── 界面 ───────────────────────────────────────────────────────────────────
ui:
  # 主色。可以写预设名（blue / teal / green / purple / pink / orange / indigo /
  # graphite），也可以写任意 #RRGGBB。桌面窗口和网页控制台都认它。
  # 留空 = 默认蓝。改完立刻生效，不用重启。
  accent: ""
  # 主界面底部的「唤醒 / 算力 / 合成 / 声纹」四格，想更清爽可以关掉
  show_stats: true           # 主界面底部那四格速览（唤醒 / 算力 / 合成 / 声纹）
  show_turn: true            # 主界面上显示"本轮问答"：刚才听成了什么、答了什么

# ── 唤醒词 ─────────────────────────────────────────────────────────────────
wake:
  enabled: true
  # 说出任意一个即可唤醒。建议 3~5 个音节、非叠词（「小爱小爱」这类叠词在这套
  # 音素级 KWS 上命中率明显偏低）。
  keywords: ["大肥鲸", "你好大肥鲸"]
  threshold: 0.25           # 命中阈值，吵的环境调高，喊不醒调低
  score: 1.5                # 关键词奖励分
  cooldown_ms: 1500         # 两次触发的最小间隔，防抖
  replies: ["我在", "请说", "嗯，你说"]
  reply_random: true

# ── 语音识别 ───────────────────────────────────────────────────────────────
asr:
  punctuation: true         # 用 CT-Transformer 给识别结果补标点（模型存在时生效）
  # 同音字/口误纠正，[正则, 替换]，按顺序应用
  corrections:
    # 唤醒词在句首被听错是常态：唤醒本身走的是音素级 KWS（听错也不影响唤醒），
    # 但「大肥鲸，打开浏览器」整句进 ASR 时会变成「大费劲打开浏览器」之类。
    # 实测 5 个音色 15 次合成，句首 14 次听错（大肥青 / 大北京 / 大飞机 / 大飞京…），
    # 所以干脆把句首这一小段抹掉，后面的指令原样保留。
    - ["^大(肥|匪|飞|非|北|费)(鲸|青|精|京|经|惊|军|劲)", ""]
    - ["(打开|启动)浏览(起|气)", "打开浏览器"]
    # 实测：合成音/轻声说「现在几点了」容易被识别成「现在急眼了」，纠回来
    - ["现在(急眼|急点|记点)了", "现在几点了"]

# ── 语音合成 ───────────────────────────────────────────────────────────────
tts:
  enabled: true
  # vits    = 纯 CPU、快，5 个角色音（默认，推荐常驻用这个）
  # chattts = 对话式中文，自然得多；但要独显（约 2 GB 显存）、首次加载十几秒、
  #           合成速度大约 1 倍实时。没装 ChatTTS 包时启动会直接报错。
  # 留空则跟随 speech.profile。换引擎要重启引擎（主界面会弹提示）。
  engine: vits
  # ChatTTS 专用：auto / cuda / cpu；compile 打开 torch.compile（首次编译更慢）
  device: auto
  compile: false
  # 音色：
  #   vits    —— 写角色名或编号（0~4）：
  #              suyingxue 标准女声(0) / gunian 男声(1) / fushiyu 女声(2)
  #              / bingjiao 低柔女声(3) / bazong 男声(4)
  #   chattts —— 写种子（seed42 或直接 42）。同一个种子永远是同一个人，
  #              换个数就换个人；挑过的种子：0 42 1111 2024 3407 6666 8888 12345
  # 先试听再定：voice_agent voices --audition，或者界面上点「试听」。
  voice: ""
  speaker_id: 0             # 没写 voice 时才用它；vits 是 0~4，chattts 是种子号
  speed: 1.0
  volume: 1.0
  # 响度：按 RMS 定（0.10 约等于正常说话）。早先按峰值归一化，等于把底噪一起
  # 抬 9 dB，安静段落里能听见嘶嘶声 —— 这就是"电流声"的来源之一。
  target_rms: 0.10
  target_peak: 0.9          # 软限幅上限，超过就压圆，不做硬削波
  noise_gate: -55.0         # 低于这个电平（dBFS）往下压，最大 8 dB；-100 表示关掉
  # 语气：不同场景用不同语速
  styles:
    wake:    {speed: 1.06}
    reply:   {speed: 1.00}
    notice:  {speed: 1.02}
    confirm: {speed: 0.95}
    error:   {speed: 0.93}

# ── 大脑（LLM）─────────────────────────────────────────────────────────────
# 留空 api_key 时会依次读环境变量 DEEPSEEK_API_KEY / OPENAI_API_KEY；
# 都没有就自动降级为「离线规则模式」——常用指令照样能用，只是不会闲聊。
llm:
  enabled: true
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key: ""
  temperature: 0.3
  max_rounds: 6             # 一次指令最多几轮「思考-调工具」；写 0 = 不限制
  # 看图（look_at_screen）送给视觉模型的截图最长边。4K 屏一张截图几百万像素，
  # 又慢又贵而识别效果几乎一样；但界面字小的时候缩太狠会看不清。
  vision_max_side: 1280
  # 多模型：routes 决定"哪个用途用哪个档案"，profiles 定义档案。
  # 设置 → 大脑（LLM）→「配置多模型…」里有图形界面，不用手写这一段。
  # routes:
  #   chat: default          # 主对话
  #   judge: fast            # 判断"确认/取消"，要快
  #   vision: vlm            # 看图，必须支持图片输入
  #   subagent: default      # 后台子代理
  # profiles:
  #   fast: {model: deepseek-chat, reasoning_effort: off, temperature: 0}
  #   vlm:  {base_url: "https://api.siliconflow.cn/v1", model: "Qwen/Qwen2.5-VL-32B-Instruct", vision: true}
  timeout_s: 30

# ── 权限 ───────────────────────────────────────────────────────────────────
# 模型（以及它背后的中转站）的输出是**不可信输入**：谁都能在回答里塞一句工具调用。
# 这一节决定"它到底能动本机的什么"，判定发生在工具层，模型说不上话。
security:
  # read-only          只读：只能查，写文件/点鼠标/执行命令一律直接拒绝
  # workspace-write    标准（默认）：敏感操作先语音确认一次
  # danger-full-access 放开：敏感操作直接做 —— 但关机和执行命令**仍然要确认**
  mode: workspace-write
  # 明文 HTTP 的模型地址要不要照用。默认 false：那种链路上任何人都能改写模型的
  # 回答（也就能塞工具调用），所以会自动降到只读模式。本机地址不受影响。
  allow_insecure: false
  # 一分钟内最多弹几次确认（防"反复弹确认把你问烦"这种疲劳战术），0 = 不限
  max_prompts_per_minute: 6
  # 同一个操作连着要几次就拦下，0 = 不限
  max_same_action: 3
  # 审计日志：build/audit.jsonl，记录每次敏感决定的工具、参数、批没批
  audit: true

# ── 交互 ───────────────────────────────────────────────────────────────────
agent:
  # 播报期间喊唤醒词可以打断（耳机或已开回声消除时体验最好；外放可能自激）
  barge_in_wake: true
  listen_timeout_ms: 8000    # 唤醒后等你说话的时长
  # 回答完之后要不要继续收音：auto（默认，由 LLM 决定）/ always（每次都留）/ off
  follow_up_mode: auto
  # 追问窗口长度。auto 模式下只有"它反问了你"或"它调了 keep_listening"才会留窗口
  follow_up_ms: 6000
  # ── 子代理：把「要跑好几步」的事丢到后台单独做 ──
  # 主对话先回一句"我让人去查了"，用户可以接着说别的，做完它自己回来汇报。
  subagent_enabled: true
  subagent_max: 3            # 同时最多几个
  subagent_rounds: 8         # 每个子代理最多调几次工具
  subagent_announce: true    # 做完主动念一句结果；关掉就只记在对话记录里
  cues: true                 # 收音 / 确认 / 结束 的提示音，让你知道什么时候该说话
  max_utterance_ms: 15000    # 单句话最长录音
  min_silence_ms: 700        # 静音多久算说完了
  confirm:
    enabled: true            # 敏感操作（关机/删文件/执行命令）先问一句
    timeout_ms: 10000
    # 先判 no 再判 yes（「不行」里含「行」）；都不中就交给 LLM 做语义判定
    yes: ["确认", "确定", "可以", "同意", "执行", "继续", "没问题", "好的", "好", "行", "是", "对", "弄吧", "干吧", "yes", "ok"]
    no:  ["取消", "不要", "不用", "别", "停", "否", "算了", "先不", "不好", "不行", "no"]
    prompt: "这是敏感操作，确认执行吗？"
  exit_words: ["退下", "再见", "关闭语音", "退出语音"]
  persona: |
    你是运行在用户 Windows 电脑上的语音助手，名字叫「大肥鲸」。
    用户是用嘴跟你说话，你的回答会被朗读出来，所以：
    - 只说你必须说的，一到两句话讲完，不要罗列 Markdown、不要用列表和标题；
    - 数字、单位要口语化（例如「还剩 156 GB」），不要念文件路径和一长串 ID；
    - 拿不准就先调用工具确认，不要编造；
    - 工具执行完，用一句话报告结果，而不是复述调用过程。
