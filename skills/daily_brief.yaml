# 组合型技能：把已有工具串起来（action.type = sequence）
# 每一步都是 {tool: 工具名, args: {...}}，结果自动用「；」连起来播报。
name: daily_brief
title: 每日简报
description: 一次性汇报当前时间、电脑状态和磁盘剩余空间。当用户说「来个简报」「汇报一下情况」时调用。
parameters: {}
# 用途标签：会显示在给模型的工具说明最前面（【简报·一次问完】…）。
# 同一件事有好几种做法时，模型靠它一眼挑对的那个；写 1~4 个词就够。
tags: [简报, 一次问完]
triggers: ["每日简报", "来个简报", "汇报一下情况", "汇报情况", "今日简报"]
action:
  type: sequence
  confirm: false
  steps:
    - tool: get_time
      args: {}
    - tool: system_info
      args:
        kind: "全部"
